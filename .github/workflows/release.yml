name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Validate tag and pack plugin
        id: pack
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          npm pack --ignore-scripts --json > npm-pack.json
          node --input-type=module -e '
            import fs from "node:fs";
            const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const log = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = log.indexOf(`## ${version} - `);
            if (start < 0) throw new Error(`Missing changelog entry for ${version}`);
            const end = log.indexOf("\n## ", start + 1);
            fs.writeFileSync("RELEASE_NOTES.md", log.slice(start, end < 0 ? undefined : end).trim() + "\n");
          '
          package_file="$(node -p "require('./npm-pack.json')[0].filename")"
          npm run package:installer
          installer_file="output/dsh-codexlike-projectless-${version}-windows-installer.zip"
          sha256sum "$package_file" "$installer_file" > SHA256SUMS
          echo "installer_file=$installer_file" >> "$GITHUB_OUTPUT"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.pack.outputs.tag }}
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
          INSTALLER_FILE: ${{ steps.pack.outputs.installer_file }}
          PRERELEASE: ${{ steps.pack.outputs.prerelease }}
        shell: bash
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$RELEASE_TAG" "$PACKAGE_FILE" "$INSTALLER_FILE" SHA256SUMS \
            --notes-file RELEASE_NOTES.md --title "$RELEASE_TAG" --target "$GITHUB_SHA" "${args[@]}"
